<template>

        <span class="eyebrow">Token access</span>
        <h1>Sign in</h1>

        <form id="login" class="panel-stack compact">
          <label class="field"><span>Registered email</span><input name="email" type="email" placeholder="user@example.org" required autocomplete="username"></label>
          <label class="field"><span>Access token</span><input name="token" type="password" placeholder="Access token issued by the organizers" required autocomplete="current-password"></label>
          <button class="button button-primary" type="submit">Sign in</button>

        <span class="eyebrow">Technical report &middot; Preliminary round</span>

        <p class="lead">Your team has not been selected for the real-robot finals. We appreciate your contribution to the preliminary stage.</p>
      </header>
      <section class="section shell finals-submission">

          <p>We recommend posting your report on arXiv and citing the RoboSynChallenge paper.</p>
          <div id="report-links" class="cta-row">
            <a class="button button-primary" href="/#/workshop/submit"><i data-lucide="file-up" aria-hidden="true"></i> Submit a paper</a>
            <a id="report-paper" class="button button-secondary" href="https://arxiv.org/abs/2608.12416" target="_blank" rel="noopener noreferrer"><i data-lucide="book-open" aria-hidden="true"></i> RoboSynChallenge paper</a>
          </div>
        </div>
      </section>
    </div>

      <header class="shell finals-heading">
        <span class="eyebrow">Policy submission &middot; Real-robot finals</span>
        <h1>Submit your evaluation artifact.</h1>
        <p class="lead">Code repository, Hugging Face checkpoints, data source, and run notes.</p>
        <p class="helper-note">Submission deadline: <strong>November 15, 2026, 23:59 AoE</strong> (UTC&minus;12)</p>
